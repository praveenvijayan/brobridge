# Publishing, driven by changesets.
#
# The flow has two passes over `main`. A push carrying changesets makes this
# open or update the "Version Packages" pull request, which holds the version
# bumps and CHANGELOG entries. Merging that pull request is the second push:
# no changesets remain, so this runs the publish instead.
#
# Two preconditions are manual and outside this file:
#   1. the `@brobridge` scope exists on npm and the account can publish it,
#   2. `NPM_TOKEN` — an automation token — is set in the repository secrets.
name: Release

on:
  push:
    branches: [main]

# Never let two publishes race; a half-published version set is not something
# a rerun fixes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # version bumps, tags, the Version Packages branch
      pull-requests: write # the Version Packages pull request
      id-token: write # npm provenance signs with this
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets reads history to work out what has been released.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The gate that matters here: nothing untested reaches the registry.
      # `pnpm release` builds again before publishing, which is cheap and
      # keeps the published artefact the one this job just tested.
      - run: pnpm test

      - name: Packaging is publishable
        run: pnpm publint

      - uses: changesets/action@v1
        with:
          version: pnpm version
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
